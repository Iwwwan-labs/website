name: Website quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static website checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate HTML structure and local links
        run: python3 scripts/check_site.py
